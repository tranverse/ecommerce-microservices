spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:auth_app}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      minimum-idle: ${AUTH_DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_JWT_REFRESH_TOKEN_TTL:P30D}
    key-id: ${AUTH_JWT_KEY_ID:ecommerce-local-key}
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${AUTH_JWT_PUBLIC_KEY_BASE64:}
    require-configured-key: ${AUTH_JWT_REQUIRE_CONFIGURED_KEY:false}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
