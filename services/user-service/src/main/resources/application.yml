spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${USER_DB_USERNAME:user_app}
    password: ${USER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${USER_DB_POOL_SIZE:10}
      minimum-idle: ${USER_DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

user:
  auth:
    issuer: ${USER_AUTH_ISSUER:http://localhost:8081}
    jwks-uri: ${USER_AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    connect-timeout: ${USER_AUTH_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${USER_AUTH_READ_TIMEOUT:PT2S}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    probes:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"
