spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USERNAME:order_app}
    password: ${ORDER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${ORDER_DB_POOL_SIZE:10}
      minimum-idle: ${ORDER_DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:order-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

order:
  auth:
    issuer: ${ORDER_AUTH_ISSUER:http://localhost:8081}
    jwks-uri: ${ORDER_AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    connect-timeout: ${ORDER_AUTH_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${ORDER_AUTH_READ_TIMEOUT:PT2S}
  product-catalog:
    base-url: ${ORDER_PRODUCT_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${ORDER_PRODUCT_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${ORDER_PRODUCT_READ_TIMEOUT:PT3S}

saga:
  messaging:
    listener-enabled: ${SAGA_MESSAGING_LISTENER_ENABLED:true}
    inventory-events-topic: ${INVENTORY_EVENTS_TOPIC:inventory.events.v1}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:PT1S}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
    send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:PT5S}
    initial-retry-delay: ${OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY:PT1S}
    max-retry-delay: ${OUTBOX_PUBLISHER_MAX_RETRY_DELAY:PT1M}

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"
