spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${PRODUCT_DB_USERNAME:product_app}
    password: ${PRODUCT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PRODUCT_DB_POOL_SIZE:10}
      minimum-idle: ${PRODUCT_DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      url: ${PRODUCT_REDIS_URL:redis://localhost:6379}
      connect-timeout: ${PRODUCT_REDIS_CONNECT_TIMEOUT:PT0.5S}
      timeout: ${PRODUCT_REDIS_COMMAND_TIMEOUT:PT0.5S}
      repositories:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

product:
  cache:
    enabled: ${PRODUCT_CACHE_ENABLED:true}
    key-prefix: ${PRODUCT_CACHE_KEY_PREFIX:ecommerce:product:}
    ttl: ${PRODUCT_CACHE_TTL:PT5M}

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
