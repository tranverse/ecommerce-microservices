spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USERNAME:inventory_app}
    password: ${INVENTORY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${INVENTORY_DB_POOL_SIZE:10}
      minimum-idle: ${INVENTORY_DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${INVENTORY_KAFKA_CONSUMER_GROUP:inventory-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

saga:
  messaging:
    listener-enabled: ${SAGA_MESSAGING_LISTENER_ENABLED:true}
    inventory-commands-topic: ${INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:PT1S}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
    send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:PT5S}
    initial-retry-delay: ${OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY:PT1S}
    max-retry-delay: ${OUTBOX_PUBLISHER_MAX_RETRY_DELAY:PT1M}

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    probes:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"
