spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USERNAME:inventory_app}
    password: ${INVENTORY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${INVENTORY_DB_POOL_SIZE:10}
      minimum-idle: ${INVENTORY_DB_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${INVENTORY_KAFKA_CONSUMER_GROUP:inventory-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: ${KAFKA_OBSERVATION_ENABLED:true}
    template:
      observation-enabled: ${KAFKA_OBSERVATION_ENABLED:true}
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

saga:
  messaging:
    listener-enabled: ${SAGA_MESSAGING_LISTENER_ENABLED:true}
    inventory-commands-topic: ${INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}

messaging:
  consumer-reliability:
    max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
    initial-interval: ${KAFKA_CONSUMER_RETRY_INITIAL_INTERVAL:PT0.25S}
    multiplier: ${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}
    max-interval: ${KAFKA_CONSUMER_RETRY_MAX_INTERVAL:PT2S}
    recovery-timeout: ${KAFKA_DLT_PUBLISH_TIMEOUT:PT5S}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:PT1S}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
    send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:PT5S}
    initial-retry-delay: ${OUTBOX_PUBLISHER_INITIAL_RETRY_DELAY:PT1S}
    max-retry-delay: ${OUTBOX_PUBLISHER_MAX_RETRY_DELAY:PT1M}

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
