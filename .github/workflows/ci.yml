name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Java, integration, and configuration gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            services/*/pom.xml

      - name: Run unit and integration tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Generate disposable Compose configuration
        shell: pwsh
        run: ./scripts/bootstrap-local-env.ps1 -OutputPath .env.ci

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.ci config --quiet

      - name: Remove disposable configuration
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath .env.ci -Force -ErrorAction SilentlyContinue

  container-build:
    name: Build ${{ matrix.service }} image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build service image
        run: >-
          docker build
          --file services/${{ matrix.service }}/Dockerfile
          --tag ecommerce/${{ matrix.service }}:ci-${{ github.sha }}
          .
