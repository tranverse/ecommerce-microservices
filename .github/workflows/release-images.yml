name: Release Container Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            services/*/pom.xml

      - name: Run unit and integration tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Publish ${{ matrix.service }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish immutable images
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_root="ghcr.io/${GITHUB_REPOSITORY}/${SERVICE}"
          docker buildx build \
            --file "services/${SERVICE}/Dockerfile" \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "${image_root}:${GITHUB_REF_NAME}" \
            --tag "${image_root}:sha-${short_sha}" \
            --push .
